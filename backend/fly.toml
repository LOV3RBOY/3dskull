# fly launch --no-deploy --copy-config ; fly volumes create studio_data --size 10 ; fly secrets set ... ; fly deploy
app = "xs-studio"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"

[[mounts]]
  source = "studio_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "performance-2x"
  memory = "4gb"
