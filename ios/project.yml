# XcodeGen spec for XS Studio.
#   brew install xcodegen && cd ios && xcodegen generate && open XSStudio.xcodeproj
# Change XS_BUNDLE_ID / DEVELOPMENT_TEAM below (or in Xcode → Signing & Capabilities).
name: XSStudio
options:
  bundleIdPrefix: com.xsstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    XS_BUNDLE_ID: com.xsstudio.app
targets:
  XSStudio:
    type: application
    platform: iOS
    sources:
      - path: XSStudio
    settings:
      base:
        PRODUCT_NAME: XSStudio
        PRODUCT_BUNDLE_IDENTIFIER: $(XS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: XSStudio/Info.plist
      properties:
        CFBundleDisplayName: XS Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: XS Studio uploads artist photos, venue shots and reference posts from your library.
        NSPhotoLibraryAddUsageDescription: XS Studio saves finished flyers and posts to your Photos.
        NSCameraUsageDescription: XS Studio can capture venue and crowd photos for content.
        NSLocalNetworkUsageDescription: XS Studio connects to your studio server on the local network during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  XSStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XSStudioTests
    dependencies:
      - target: XSStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(XS_BUNDLE_ID).tests
        CODE_SIGN_STYLE: Automatic
schemes:
  XSStudio:
    build:
      targets:
        XSStudio: all
        XSStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - XSStudioTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
